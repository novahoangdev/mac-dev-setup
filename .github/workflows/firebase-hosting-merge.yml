# Deploys the guide to https://setup-dev-mac.web.app on every push to main.
name: Deploy to Firebase Hosting (live)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SETUP_DEV_MAC }}
          projectId: setup-dev-mac
          channelId: live
